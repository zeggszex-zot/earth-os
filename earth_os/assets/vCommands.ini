// = comment!
computer = computer //start voice command recognition.
continuous commands = continuous commands //Disables having to say "computer".
end commands = end commands //re-enables having to say "computer" to activate commands.
end continuous commands = end commands //alias for "end commands".
access = access //same as clicking the "ACCESS" button.
//another comment!
menu = menu //Opens the start menu WITHOUT opening All Programs.
my computer = my computer //Opens My Computer
my documents = my documents //Opens the user's My Documents folder
my pictures = my pictures //Opens the users's My Pictures folder
web browser = web browser //Opens the default web browser
my music = my music //Opens the user's My Music folder
programs = programs //Opens/Closes the All Programs menu. Start Menu must be open in order to see.
deactivate = deactivate //If running in shell mode, shuts down the computer.  Otherwise, exits the program.
specify parameters = specify parameters //Opens the settings screen
settings = specify parameters //Opens the settings screen just like specify parameters (an alias).
log off = log off //Show the log off screen.
system browser = system browser //Opens the integrated browser
home = home //brings the user back to the main screen with the UFP logo (or their background).
list programs = list programs //Open the Start Menu and show the All Programs list
shut down = shut down //shuts down the computer
back = back //the same as hitting the "back" button in My Computer and the system browser.
scroll down = scroll down
scroll up = scroll up
next page = scroll down
last page = scroll up
programs running = programs running //Show the windows of other running programs.
running programs = programs running //alias
switch = programs running //Open the window switcher.
windows = programs running //alias for the window switcher.
back to earth os = back to earth os //Bring EARTH OS back to the front.
recent = recent //Opens the recently used programs list.
recent programs = recent //Opens the recently used programs list.
recently used = recent //alias for the recently used programs list.
terminal = terminal //Opens the built-in terminal.
command line = terminal //alias for the terminal.
console = terminal //alias for the terminal.
claude = claude //Opens Claude Code, the built-in coding agent. "Claude, <request>" asks it directly.
claude code = claude //alias for Claude Code.
system evolution center = evolution //Opens the System Evolution Center: health, optimizations, capabilities and the roadmap.
evolution center = evolution //alias for the System Evolution Center.
system evolution = evolution //alias for the System Evolution Center.
