# sway configuration for the EARTH OS session.
# earth-os-config-version: 6
#
# The version line above is how the session script knows whether your copy is
# older than the shipped one. When it is, your copy is moved aside to
# sway.conf.bak and replaced, so a fix to the keybindings actually reaches you
# instead of sitting unread in /usr/share.
#
# sway tiles by default, which is wrong for this shell: the moment a program
# opens, sway splits the screen and the LCARS interface shrinks into half of
# it. The shell is meant to BE the frame, with programs placed inside it, so
# everything floats and the shell positions things itself.
#
# Copied to ~/.config/earth-os/sway.conf on first run of the session script.
# Edit that copy; this one is the template.

### Appearance ##############################################################

output * bg #000000 solid_color

# No decorations anywhere: the LCARS chrome is the decoration.
#
# These two do the whole job, together with the `border none` on each
# for_window rule below. Nothing in this session ever has a titlebar.
#
# There is deliberately no `titlebar_padding` here. It used to say
# `titlebar_padding 0`, which sway rejects outright — the minimum is 1, and
# the session came up with "Invalid size specified" on every start. It was
# also pointless: padding styles a titlebar, and with borders set to none
# there is never a titlebar to pad. A line that configures something which
# does not render is worse than no line, because it reads as deliberate.
default_border none
default_floating_border none
hide_edge_borders both
gaps inner 0
gaps outer 0

# No focus stealing surprises on a shell driven by touch or voice.
focus_follows_mouse no

### Floating ################################################################

# Everything floats so the shell can place it inside the LCARS frame.  With
# tiling left on, sway halves the shell as soon as anything else appears —
# which is exactly the bug this file exists to prevent.
for_window [app_id=".*"]  floating enable, border none
for_window [class=".*"]   floating enable, border none

# The shell itself: full output, and kept behind whatever it is framing.
for_window [app_id="org.earthos.shell"] floating enable, border none, sticky disable

### Keys ####################################################################
#
# The shell handles F1-F12 itself.  These are the ones sway must provide,
# because they have to work even when a framed program has the keyboard.

set $mod Mod4

# Back to the shell.
#
# These have to be compositor bindings, not shell ones. Once a program has the
# keyboard, a bare F1 goes to that program — Firefox opens its help — and the
# shell never sees it. Only sway can catch a key regardless of who is focused.
bindsym $mod+F1   exec swaymsg '[app_id="org.earthos.shell"] focus'
bindsym $mod+Home exec swaymsg '[app_id="org.earthos.shell"] focus'

# Take the focused program out of fullscreen and give the shell the screen
# back. The pair of them is the way out of a program that covered everything.
bindsym $mod+F11 exec swaymsg fullscreen disable; exec swaymsg '[app_id="org.earthos.shell"] focus'

# Alt+Tab: round through the home screen and every open program.
#
# Also a compositor binding, for the same reason as the pair above: once a
# program has the keyboard, Alt+Tab goes to that program and the shell never
# sees it. `earth-os --switch` moves focus one place round a ring that starts
# at the home screen and then lists programs in the order they opened;
# Alt+Shift+Tab goes the other way. It is a command rather than a swaymsg
# one-liner because sway has no "next window" for floating windows, and
# everything here floats.
bindsym Mod1+Tab       exec earth-os --switch
bindsym Mod1+Shift+Tab exec earth-os --switch-back

bindsym $mod+q       kill
bindsym $mod+Shift+e exit

# A terminal, so the machine is never unusable.
#
# Try what is actually likely to be installed, in order, and fall through to
# whatever the distro nominated. Binding this to a terminal the system does not
# have leaves no way to fix anything from inside the session.
bindsym $mod+Return exec sh -c "x-terminal-emulator || gnome-terminal || konsole || xfce4-terminal || foot || alacritty || kitty || xterm"

# Volume and brightness, since there is no desktop panel to do it.
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioMute        exec pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86MonBrightnessUp   exec brightnessctl set +10%
bindsym XF86MonBrightnessDown exec brightnessctl set 10%-

# Screenshot, because there is no desktop to provide one.
#
# This used to run grim straight into ~/Pictures, which did nothing at all —
# no file, no message — on a machine without grim or without that folder
# (grim does not create it). earth-os --screenshot uses the same capture
# chain as the SCREEN SHOT button, creates Pictures/EARTH OS Screenshots, and the
# running shell shows where the picture went. $mod+Shift+s is for keyboards
# whose Print key is behind Fn, or missing.
bindsym Print exec earth-os --screenshot
bindsym $mod+Shift+s exec earth-os --screenshot

### Session environment #####################################################

# Hand the display and bus to the user systemd instance and to the portals.
# Without this, file dialogs, notifications and anything D-Bus activated can
# come up with no display or simply not start.
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE SWAYSOCK DBUS_SESSION_BUS_ADDRESS
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE SWAYSOCK

### Start the shell #########################################################

# `swaymsg exit` when the shell stops, so DEACTIVATE, Ctrl+Q or a crash returns
# you to the login screen. Without it sway keeps running with no client, and
# you get a black screen with a cursor and no way out but Ctrl+Alt+F3.
exec sh -c "earth-os; swaymsg exit"
